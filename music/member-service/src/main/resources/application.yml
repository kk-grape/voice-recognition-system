server:
  port: 18002

feign:
  sentinel:
    enabled: true # 开启feign对sentinel的支持

spring:
  application:
    name: member-service
  config:
    import: "optional:nacos:member-service.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: music
      config:
        server-addr: localhost:8848
        namespace: music
        file-extension: yml
    sentinel:
      transport:
        dashboard: localhost:8090
        port: 8719
      http-method-specify: true # 开启请求方式前缀
  datasource:
    url: jdbc:mysql://localhost:3306/kk-member?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
    username: root
    password: your-mysql-password
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
  main:
    allow-circular-references: true

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml

logging:
  level:
    com.music.nls.member.mapper: trace

# 阿里云短信配置（由原单体应用 business/application.properties 迁移而来）
sms:
  aliyun:
    signName: "\u963f\u91cc\u4e91\u77ed\u4fe1\u6d4b\u8bd5"
    templateCode: SMS_154950909
    accessKeyId: your-aliyun-access-key-id
    accessKeySecret: your-aliyun-access-key-secret

# 上传文件大小限制（沿用单体应用配置）
servlet:
  multipart:
    max-file-size: 500MB
    max-request-size: 500MB

# 阿里云OSS配置（由原单体应用 business/application.properties 迁移而来）
alioss:
  endpoint: oss-cn-hangzhou.aliyuncs.com
  access-key-id: your-oss-access-key-id
  access-key-secret: your-oss-access-key-secret
  bucket-name: tlias-kk

seata:
  tx-service-group: music-tx-group
  service:
    vgroup-mapping:
      music-tx-group: default
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: music
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: music
      group: SEATA_GROUP
  data-source-proxy-mode: AT
